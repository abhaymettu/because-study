[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rosterkit"
description = "Read class roster CSV files and produce attendance summaries"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]

[tool.setuptools]
packages = ["rosterkit"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
